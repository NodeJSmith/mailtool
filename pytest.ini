[pytest]
# Pytest configuration for mailtool Outlook bridge

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Column output for clearer test results
    --tb=short
    # Strict markers
    --strict-markers
    # Warn about assertions that aren't being used
    --strict-config
    # Disable warnings (can be re-enabled with -W default)
    -p no:warnings

# Markers for categorizing tests
markers =
    slow: Tests that take longer to run (e.g., large folder operations)
    integration: Tests that work with real Outlook data
    windows: Needs Windows with pywin32 and a running Outlook; applied automatically by conftest to tests using the bridge fixture
    unit: Pure-Python tests that do NOT require Outlook (safe to run anywhere)
    email: Tests for email functionality
    calendar: Tests for calendar functionality
    tasks: Tests for task functionality
    cleanup: Tests that clean up test artifacts

# Test paths
testpaths = tests
pythonpath = src

# Log configuration (optional, for debugging)
# log_cli = true
# log_cli_level = INFO


# Don't catch system exceptions (better for debugging COM issues)
# catch_system_exceptions = false
